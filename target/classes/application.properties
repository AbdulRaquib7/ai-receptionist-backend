# Server Configuration
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging Configuration
logging.level.com.ai.receptionist=INFO

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}
twilio.media-stream-url=${TWILIO_MEDIA_STREAM_URL}
twilio.base-url=${TWILIO_BASE_URL}
# Set to false for local development (bypasses Twilio signature checks)
twilio.validate-signatures=${TWILIO_VALIDATE_SIGNATURES:true}

# WebSocket CORS — comma-separated origins allowed for browser WebSocket connections.
# Twilio Media Streams connect server-to-server and are NOT affected by this setting.
# Leave empty in production (no browser access needed). Set to * only for local dev.
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:}

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# ElevenLabs Configuration
elevenlabs.api-key=${ELEVENLABS_API_KEY}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID}
elevenlabs.voice.enabled=${ELEVENLABS_VOICE_ENABLED:true}

# PostgreSQL
spring.cloud.gcp.sql.username=${GCP_SQL_USERNAME:postgres}
spring.cloud.gcp.sql.database-name=${GCP_SQL_DATABASE:postgres}
spring.cloud.gcp.sql.instance-connection-name=${GCP_SQL_INSTANCE_CONNECTION}
# Note: spring.datasource.url is omitted here to allow spring-cloud-gcp-starter-sql-postgresql
# to auto-configure the connection on Cloud Run.
# For local development, use the 'local' profile.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — schema migrations replace ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Admin & Metrics API Key — protects /api/admin and /api/metrics endpoints.
# Set via env METRICS_API_KEY. If blank, endpoints are unprotected.
metrics.api-key=${METRICS_API_KEY:}

# Actuator — health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Conversation Pipeline Tuning
# Consecutive silent frames before end-of-speech trigger (~20ms each at 8kHz mulaw).
# 25 frames ≈ 500ms silence wait. Needed to accommodate natural word-to-word pauses.
conversation.silence-frame-threshold=25
# Average byte energy below which a frame is silent (0–255 scale).
# Higher = stricter silence classification, compensates for lower frame threshold.
# Original default: 8.
conversation.silence-energy-threshold=10
# Minimum audio buffer (bytes) before silence can trigger processing.
conversation.min-audio-bytes=16000
# Maximum audio buffer (bytes) — forces processing even without silence.
conversation.max-buffer-bytes=64000
# conversation.recent-message-window=6
# conversation.llm-temperature=0.2
# conversation.slot-look-ahead-days=7
# conversation.max-llm-history-messages=20

# OpenAI Realtime API Pipeline (per-tenant opt-in)
# Global kill-switch: set to false to disable for ALL tenants regardless of DB flag.
# Override via env: CONVERGE_REALTIME_ENABLED=true
converge.realtime.enabled=${CONVERGE_REALTIME_ENABLED:false}
converge.realtime.model=gpt-4o-realtime-preview
converge.realtime.voice=alloy
converge.realtime.api-url=wss://api.openai.com/v1/realtime
# Server-side VAD: ms of silence before turn end declared
converge.realtime.vad-silence-duration-ms=500
# VAD sensitivity (0.0 = least sensitive, 1.0 = most sensitive)
converge.realtime.vad-threshold=0.5
# Audio padding before speech detected (ms)
converge.realtime.vad-prefix-padding-ms=300
# Max session duration (5 min)
converge.realtime.session-timeout-ms=300000
