# Local PostgreSQL Configuration
# Set these as environment variables or in a local .env file
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Twilio signature validation for local development
twilio.validate-signatures=false

# Allow all browser WebSocket origins for local development
websocket.allowed-origins=*
